name: Test Changed Features

on:
  pull_request:
    paths:
      - src/**
      - test/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Filter for changed paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            actionlint: ./**/actionlint/**
            common-utils: ./**/common-utils/**
            hadolint: ./**/hadolint/**
            pre-commit: ./**/pre-commit/**
            prettier: ./**/prettier/**
            shellcheck: ./**/shellcheck/**
            shfmt: ./**/shfmt/**

    outputs:
      changed-features: ${{ steps.filter.outputs.changes }}

  test-autogenerated:
    needs: [check]
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        features: ${{ fromJSON(needs.check.outputs.changed-features) }}
        baseImage:
          - almalinux:10-minimal
          - debian:bookworm
          - debian:trixie
          - fedora:43
          - fedora:44
          - ubuntu:jammy
          - ubuntu:noble
          - ubuntu:resolute

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm install

      - name: Test ${{ matrix.features }} on ${{ matrix.baseImage }}
        run: .github/retry.sh devcontainer features test --skip-scenarios -f "${FEATURE}" -i ${{ matrix.baseImage }} .
        env:
          FEATURE: ${{ matrix.features }}

  test-scenarios:
    needs: [check]
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        features: ${{ fromJSON(needs.check.outputs.changed-features) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm install

      - name: Test ${{ matrix.features }} scenarios
        run: .github/retry.sh devcontainer features test -f "${FEATURE}" --skip-autogenerated --skip-duplicated .
        env:
          FEATURE: ${{ matrix.features }}

  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm install

      - name: Test global scenarios
        run: .github/retry.sh devcontainer features test --global-scenarios-only .
