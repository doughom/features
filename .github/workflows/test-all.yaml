name: Test All Features

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        features:
          - actionlint
          - common-utils
          - hadolint
          - pre-commit
          - prettier
          - shellcheck
          - shfmt

        baseImage:
          - almalinux:9-minimal
          - almalinux:10-minimal
          - debian:bookworm
          - debian:trixie
          - fedora:43
          - fedora:44
          - ubuntu:jammy
          - ubuntu:noble
          - ubuntu:resolute

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: npm install

      - name: Test ${{ matrix.features }} on ${{ matrix.baseImage }}
        run: ./node_modules/.bin/devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        features:
          - common-utils

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: npm install

      - name: Test ${{ matrix.features }} scenarios
        run: ./node_modules/.bin/devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: npm install

      - name: Test global scenarios
        run: ./node_modules/.bin/devcontainer features test --global-scenarios-only .
